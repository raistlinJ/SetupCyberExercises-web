<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeployForge — Exports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/shell.css" rel="stylesheet">
  <link rel="icon" href="/static/favicon.ico">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="shell-body">
<header class="app-banner">
  <div class="container-fluid d-flex align-items-center justify-content-between py-2">
    <div class="d-flex align-items-center gap-2">
      <span aria-hidden="true" class="banner-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="5" cy="5" r="3" stroke="white" stroke-width="1.5"/>
          <circle cx="19" cy="5" r="3" stroke="white" stroke-width="1.5"/>
          <circle cx="12" cy="19" r="3" stroke="white" stroke-width="1.5"/>
          <line x1="7.5" y1="6.5" x2="16.5" y2="6.5" stroke="white" stroke-width="1.5"/>
          <line x1="10.2" y1="9.2" x2="6.8" y2="16.2" stroke="white" stroke-width="1.5"/>
          <line x1="13.8" y1="9.2" x2="17.2" y2="16.2" stroke="white" stroke-width="1.5"/>
        </svg>
      </span>
  <span class="banner-title">DeployForge</span>
    </div>
    <div class="d-flex align-items-center gap-3" id="banner-user-region" style="min-width:260px;justify-content:flex-end;">
      <div id="banner-user-label" class="small text-white-50">User: <span id="banner-username" class="text-white">…</span></div>
      <div class="dropdown">
        <button class="btn btn-sm btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Menu</button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="/" data-act="open-settings">Settings</a></li>
          <li><a class="dropdown-item" href="/static/admin_users.html">Users</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><button class="dropdown-item text-danger" id="banner-logout" type="button">Logout</button></li>
        </ul>
      </div>
    </div>
  </div>
  <div class="banner-overlay" aria-hidden="true"></div>
</header>
<div class="container-fluid shell-container">
  <div class="row g-0">
    <aside class="col-12 col-md-3 col-lg-2 shell-sidebar bg-light d-flex flex-column">
      <div class="p-2 border-bottom d-flex gap-2">
        <input id="proj-name" class="form-control form-control-sm" placeholder="New project name" title="Project name" />
        <button class="btn btn-sm btn-primary" onclick="createProjectSidebar()" title="Create project">Add</button>
      </div>
      <div class="p-2 border-bottom">
        <label class="btn btn-outline-secondary btn-sm mb-0 w-100" title="Import a project ZIP" data-remote-disable="import" data-remote-tooltip="Import is disabled when app is running in remote mode.">
          Import Project <input type="file" id="import-file" accept=".zip" hidden onchange="importProjectExports()" />
        </label>
      </div>
      <div id="sidebar-projects" class="flex-grow-1"></div>
    </aside>
    <main class="col-12 col-md-9 col-lg-10 shell-content p-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <ul class="nav nav-pills flex-nowrap">
          <li class="nav-item"><a class="nav-link" data-shell-link href="/">Configuration</a></li>
          <li class="nav-item"><a class="nav-link" data-shell-link href="/static/vm_manager.html">VM Manager</a></li>
          <li class="nav-item"><a class="nav-link" data-shell-link href="/static/ctfd_manager.html">CTFd Manager</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" data-shell-link href="/static/exports.html">Exports</a></li>
        </ul>
      </div>
      <div id="exports-host"></div>
    </main>
  </div>
</div>

<!-- Action Progress Modal (used by queue/progress helpers) -->
<div class="modal fade" id="actionProgressModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="action-progress-title" class="modal-title">Working…</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="action-progress-text" class="small mb-2" aria-live="polite"></div>
        <div class="progress">
          <div id="action-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">Starting…</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hide</button>
      </div>
    </div>
  </div>
</div>
<script src="/static/js/auth.js"></script>
<script src="/static/js/shell.js"></script>
<!-- Settings modal injected via creds.js -->
<script src="/static/js/creds.js"></script>
<script>
  function warnUser(msg){
    const text = String(msg || '').trim() || 'Action is disabled when app is running in remote mode.';
    try { if (typeof window.showToast === 'function') { window.showToast(text, 'warning'); return; } } catch {}
    try { if (window.shell && shell.logWarn) { shell.logWarn(text); return; } } catch {}
    try { alert(text); } catch {}
  }
  async function readErrorText(res){
    let bodyText = '';
    try { bodyText = (await res.text()) || ''; } catch {}
    if (!bodyText) return res.statusText || `HTTP ${res.status}`;
    try {
      const parsed = JSON.parse(bodyText);
      if (parsed && (parsed.error || parsed.message)) return String(parsed.error || parsed.message);
    } catch {}
    return bodyText;
  }
  function createProjectSidebar(){ const input=document.getElementById('proj-name'); const name=(input?.value||'').trim(); if(!name) return; fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}).then(r=>{if(!r.ok) throw new Error(); return r.json();}).then(d=>{ input.value=''; if(window.shell&&shell.setCurrentProjectId && d?.id) shell.setCurrentProjectId(d.id); if(window.shell&&shell.refreshSidebar) shell.refreshSidebar('exports'); renderExportsPage(); }).catch(()=>alert('Create failed')); }
  function importProjectExports(){}
  async function fetchExports(pid){
    const res=await fetch(`/api/projects/${encodeURIComponent(pid)}/exports`);
    if(!res.ok){
      const msg = await readErrorText(res);
      if(res.status===403) warnUser(msg);
      throw new Error(msg);
    }
    return res.json();
  }
  function escHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }
  function fmtSize(n){ try{ n=Number(n||0); if(n<1024) return n+' B'; if(n<1024*1024) return (n/1024).toFixed(1)+' KB'; if(n<1024*1024*1024) return (n/1024/1024).toFixed(1)+' MB'; return (n/1024/1024/1024).toFixed(2)+' GB'; }catch{ return String(n);} }
  let EXPORTS_RENDER_TOKEN = 0;
  let EXPORTS_SHELL_READY = false;

  async function ensureExportsShell(){
    if(EXPORTS_SHELL_READY) return;
    await shell.initShell('exports');
    EXPORTS_SHELL_READY = true;
  }

  async function renderExportsPage(){
    const pid = shell.getCurrentProjectId();
    const host = document.getElementById('exports-host');
    const token = ++EXPORTS_RENDER_TOKEN;
    if(!host) return;
    if(!pid){
      host.innerHTML = '<div class="text-muted">Select a project from the left.</div>';
      return;
    }
    host.innerHTML = '<div class="text-muted">Loading exports…</div>';
    try{
      const data = await fetchExports(pid);
      if(token !== EXPORTS_RENDER_TOKEN || String(shell.getCurrentProjectId() || '') !== String(pid || '')) return;
      const items = Array.isArray(data?.exports) ? data.exports : [];
      if(!items.length){
        host.innerHTML = '<div class="text-muted">No exports yet. Use Configuration → Export to create one.</div>';
        return;
      }
      host.innerHTML = items.map(e=>`<div class="d-flex align-items-center justify-content-between border rounded p-2 mb-2"><div class="small"><div><strong>${escHtml(e.timestamp||'')}</strong></div><div class="text-muted">${escHtml([e.include_vms?'VMs':'', e.include_creds?'Creds':''].filter(Boolean).join(' + ') || '—')}</div><div><code>${escHtml(e.local_path || e.remote_path || '')}</code> ${e.exists===false?'<span class="badge text-bg-warning ms-1">Missing</span>':''}</div><div class="text-muted">${fmtSize(e.size||0)}</div></div><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary ${e.local_path?'':'disabled'}" data-remote-disable="export" data-remote-tooltip="Export is disabled when app is running in remote mode." ${e.local_path?`href="/api/projects/${encodeURIComponent(pid)}/exports/${encodeURIComponent(e.id)}/download"`:''} ${e.local_path?'':'aria-disabled="true"'}>Download</a><button class="btn btn-sm btn-outline-secondary" data-remote-disable="export" data-remote-tooltip="Export is disabled when app is running in remote mode." data-act="copy" data-path="${escHtml(e.local_path||e.remote_path||'')}">Copy Path</button><button class="btn btn-sm btn-outline-secondary" data-remote-disable="export" data-remote-tooltip="Export is disabled when app is running in remote mode." data-act="open" data-id="${escHtml(e.id)}" ${e.local_path?'':'disabled'}>Open Folder</button><button class="btn btn-sm btn-outline-danger" data-remote-disable="export" data-remote-tooltip="Export is disabled when app is running in remote mode." data-act="delete" data-id="${escHtml(e.id)}">Delete</button></div></div>`).join('');
      try { if(window.shell && shell.applyRemoteModeUI) shell.applyRemoteModeUI(host); } catch {}
      host.querySelectorAll('[data-act="copy"]').forEach(btn=>btn.addEventListener('click', async()=>{ const path=btn.getAttribute('data-path')||''; try{ await navigator.clipboard.writeText(path);}catch{} if(window.shell&&shell.logSuccess) shell.logSuccess('Path copied to clipboard.'); }));
      host.querySelectorAll('[data-act="open"]').forEach(btn=>btn.addEventListener('click', async()=>{ const id=btn.getAttribute('data-id'); try{ const res=await fetch(`/api/projects/${encodeURIComponent(shell.getCurrentProjectId())}/exports/${encodeURIComponent(id)}/reveal`, {method:'POST'}); if(!res.ok){ const msg=await readErrorText(res); if(res.status===403) warnUser(msg); } }catch{} }));
      host.querySelectorAll('[data-act="delete"]').forEach(btn=>btn.addEventListener('click', async()=>{ const id=btn.getAttribute('data-id'); if(!confirm('Delete this export?')) return; try{ const res=await fetch(`/api/projects/${encodeURIComponent(shell.getCurrentProjectId())}/exports/${encodeURIComponent(id)}`, {method:'DELETE'}); if(!res.ok){ const msg=await readErrorText(res); if(res.status===403) warnUser(msg); throw new Error(msg); } await renderExportsPage(); } catch(e){ alert('Delete failed: '+(e?.message||e)); } }));
    }catch(e){
      if(token !== EXPORTS_RENDER_TOKEN || String(shell.getCurrentProjectId() || '') !== String(pid || '')) return;
      host.innerHTML = `<div class="text-danger">Failed to load: ${e?.message||e}</div>`;
    }
  }

  document.addEventListener('DOMContentLoaded', async()=>{
    await ensureExportsShell();
    document.addEventListener('project-selected', ()=>{ renderExportsPage(); });
    renderExportsPage();
  });
  document.addEventListener('DOMContentLoaded', async()=>{ try{ const d=await AUTH.me(); const u=d?.user; const el=document.getElementById('banner-username'); if(el) el.textContent=u?u.username:'anonymous'; const lo=document.getElementById('banner-logout'); if(lo) lo.addEventListener('click', async()=>{ await AUTH.logout(); location.href='/'; }); }catch{} });
  document.addEventListener('auth-changed', e=>{ const u=e.detail?.user; const el=document.getElementById('banner-username'); if(el) el.textContent=u?u.username:'anonymous'; });
</script>
</body>
</html>
