<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — DeployForge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/shell.css" rel="stylesheet">
  <link rel="icon" href="/static/favicon.ico">
</head>
<body class="bg-dark text-light d-flex align-items-center" style="min-height:100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow">
          <div class="card-body">
            <h5 class="card-title mb-3 text-center">Sign In</h5>
            <div class="mb-2">
              <label class="form-label small" for="auth-user">Username</label>
              <input id="auth-user" class="form-control form-control-sm" placeholder="Username" autocomplete="username" autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label small" for="auth-pass">Password</label>
              <input id="auth-pass" type="password" class="form-control form-control-sm" placeholder="Password" autocomplete="current-password">
            </div>
            <button id="auth-login" class="btn btn-primary btn-sm w-100 mb-2">Login</button>
            <div id="auth-msg" class="small text-muted text-center" role="status"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    // lightweight login page script
    (function(){
      const setMsg = (t, cls) => { const m = document.getElementById('auth-msg'); if(m){ m.textContent=t||''; m.className = 'small text-center ' + (cls||'text-muted'); } };
      async function doLogin(){
        const u = document.getElementById('auth-user').value.trim();
        const p = document.getElementById('auth-pass').value;
        if(!u || !p){ setMsg('Enter credentials','text-warning'); return; }
        setMsg('Logging in…');
        try {
          const r = await fetch('/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username:u, password:p }) });
          if(!r.ok){ setMsg(await r.text()||'Login failed','text-danger'); return; }
          const d = await r.json();
          const params = new URLSearchParams(window.location.search);
          const next = params.get('next');
          window.location.replace(next || '/');
        } catch(e){ setMsg((e && e.message) || 'Login failed','text-danger'); }
      }
      document.getElementById('auth-login').addEventListener('click', doLogin);
      document.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter') doLogin(); });
      // If already logged in, bounce away
      fetch('/auth/me').then(r=>r.ok?r.json():null).then(d=>{ if(d && d.user){ const p=new URLSearchParams(window.location.search); const n=p.get('next'); window.location.replace(n||'/'); } });
    })();
  </script>
</body>
</html>
